name: Visual review screenshots
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    name: Local demo screenshots (Arabic, English, French)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      preview_names: ${{ steps.stage.outputs.names }}
      preview_run: ${{ steps.stage.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test screenshot readiness checks
        run: node --test scripts/visual-current-version.test.mjs scripts/visual-dialogs.test.mjs scripts/visual-wait.test.mjs scripts/visual-i18n-observer.test.mjs scripts/i18n-ast-scan.test.mjs scripts/visual-summary.test.mjs
      - name: Start isolated test/test demo and capture pages
        run: |
          node scripts/visual-demo-worker.mjs
          npx wrangler dev --local --config .arena/visual-worker.json --ip 127.0.0.1 --port 8787 > /tmp/visual-worker.log 2>&1 &
          WORKER=$!
          npx vite --config scripts/vite-visual.config.mjs > /tmp/visual-vite.log 2>&1 &
          VITE=$!
          cleanup() {
            status=$?
            kill "$WORKER" "$VITE" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo '## Visual capture failed' >> "$GITHUB_STEP_SUMMARY"
              echo 'The isolated demo capture failed. Diagnostic logs are included in the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
              mkdir -p artifacts/visual-review/diagnostics
              cp /tmp/visual-worker.log /tmp/visual-vite.log artifacts/visual-review/diagnostics/ 2>/dev/null || true
              if [ -f /tmp/visual-capture.log ]; then
                cp /tmp/visual-capture.log artifacts/visual-review/diagnostics/
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                tail -n 20 /tmp/visual-capture.log >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5173/api/demo/config >/dev/null 2>&1; then break; fi
            if ! kill -0 "$WORKER" 2>/dev/null || ! kill -0 "$VITE" 2>/dev/null; then cat /tmp/visual-worker.log /tmp/visual-vite.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/api/demo/config >/dev/null
          node scripts/demo-login-smoke.mjs
          node scripts/settings-load-smoke.mjs
          set -o pipefail
          node scripts/capture-visual-review.mjs 2>&1 | tee /tmp/visual-capture.log
      - name: Upload screenshot artifact
        id: screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-review-${{ github.run_id }}
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Stage up to eight public demo previews
        id: stage
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ ! -d artifacts/visual-review ]; then exit 0; fi
          run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if names=$(node scripts/visual-summary.mjs artifacts/visual-review /tmp/atlas-visual-pages "$run"); then
            echo "names=$names" >> "$GITHUB_OUTPUT"
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No public preview images were staged.'
          fi
      - name: Upload demo previews for GitHub Pages
        if: always() && steps.stage.outputs.names != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: /tmp/atlas-visual-pages
          retention-days: 1
      - name: Link complete artifact
        if: always() && steps.screenshots.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          echo '## Visual review — isolated test/test demo' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download all captured screenshots and diagnostics]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Up to eight demo-only screenshots may be publicly published on GitHub Pages for inline preview; see the preview deployment job.' >> "$GITHUB_STEP_SUMMARY"

  previews:
    name: Public demo screenshot previews
    needs: screenshots
    if: always() && needs.screenshots.outputs.preview_names != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: atlas-visual-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish selected demo images
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Show screenshots in job summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          PREVIEW_RUN: ${{ needs.screenshots.outputs.preview_run }}
          PREVIEW_NAMES: ${{ needs.screenshots.outputs.preview_names }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.parse
          print('## Visual review — public demo previews')
          print('Up to eight images from the isolated test/test demo. A newer run replaces this Pages deployment, so older previews may stop working. The full artifact is linked in the capture job.')
          base = os.environ['PAGE_URL'].rstrip('/')
          run = urllib.parse.quote(os.environ['PREVIEW_RUN'], safe='')
          for name in json.loads(os.environ['PREVIEW_NAMES']):
              print(f"\n### {name}\n\n![{name}]({base}/{run}/{urllib.parse.quote(name, safe='')})")
          PYTHON
