name: Issue triage (auto-label + acknowledge)

# When someone opens an issue — a complaint, a bug, a hack attempt report,
# a feature wish — this reacts immediately: it classifies the issue by
# keywords (FR + EN), applies labels, and posts an acknowledgement comment
# with the right next steps. Security issues get routed to private handling
# guidance. Issues opened by bots (e.g. security-patrol) are left untouched.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify and acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.event.sender.login }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # Never triage our own automation (security-patrol, auto-merge…)
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Issue opened by automation — skipping triage."
            exit 0
          fi

          # Ensure the label palette exists (idempotent). REST only — the
          # `gh label create` / `gh issue edit` GraphQL paths can fail with
          # GITHUB_TOKEN (projects deprecation), REST never does.
          REPO="$GITHUB_REPOSITORY"
          mklabel() { gh api "repos/$REPO/labels" -f name="$1" -f color="$2" -f description="$3" >/dev/null 2>&1 || true; }
          mklabel bug         D73A4A "Something is broken"
          mklabel enhancement A2EEEF "New feature or request"
          mklabel feedback    FBCA04 "Complaint / user feedback"
          mklabel security    E11D48 "Security / intrusion"
          mklabel needs-info  D4C5F9 "Waiting for more details"

          TEXT="$(printf '%s\n%s' "$TITLE" "$BODY" | tr '[:upper:]' '[:lower:]')"
          LABELS=()

          if printf '%s' "$TEXT" | grep -qE 'hack|pirat|intrusion|exploit|vulnér|vulner|cve|xss|sql ?injection|brute ?force|waf|faille|breach|otp leak|fuite'; then
            LABELS+=("security")
          fi
          if printf '%s' "$TEXT" | grep -qE 'bug|crash|erreur|error|cassé|broken|ne (fonctionne|marche) (pas|plus)|not working|500|502|503|blank page|page blanche'; then
            LABELS+=("bug")
          fi
          if printf '%s' "$TEXT" | grep -qE 'plainte|complaint|mécontent|insatisfait|frustré|frustrat|unhappy|angry|déçu|deçu|deceived|rembours|refund'; then
            LABELS+=("feedback")
          fi
          if printf '%s' "$TEXT" | grep -qE 'feature|demande|ajout|ajouter|suggestion|would be nice|pourriez-vous|could you add|amélioration|improve'; then
            LABELS+=("enhancement")
          fi
          if [ ${#LABELS[@]} -eq 0 ]; then
            LABELS+=("needs-info")
          fi

          ADDS=()
          for L in "${LABELS[@]}"; do ADDS+=(-f "labels[]=$L"); done
          gh api -X POST "repos/$REPO/issues/$ISSUE/labels" "${ADDS[@]}" >/dev/null

          # Acknowledgement comment tailored to the classification
          HAS() { printf '%s\n' "${LABELS[@]}" | grep -qx "$1"; }
          if HAS security; then
            BODY_C="🛡️ **Signalé comme sécurité** — merci !
          - Si le problème expose des données ou un accès en cours : prévenez immédiatement un mainteneur en privé (les détails publics peuvent aider un attaquant).
          - Notre patrouille automatisée (\`security-patrol.yml\`) sonde le site chaque jour ; ce ticket sera examiné en priorité.
          - Ajoutez si possible : horodatage, URL/endpoint concerné, requête exacte (sans secrets), ce que vous avez observé."
          elif HAS bug; then
            BODY_C="🐛 **Bug enregistré** — merci du signalement.
          Pour accélérer le correctif, ajoutez si possible :
          - [ ] Étapes exactes pour reproduire
          - [ ] Navigateur / appareil (ou app Android + version)
          - [ ] Capture d'écran ou message d'erreur exact
          - [ ] Heure approximative (pour retrouver les journaux worker)"
          elif HAS feedback; then
            BODY_C="🙏 **Retour reçu** — désolé pour la gêne.
          Un mainteneur va lire ce ticket et revenir vers vous. Si cela concerne une commande ou un compte précis, indiquez la référence (jamais de mot de passe ni de code OTP ici)."
          elif HAS enhancement; then
            BODY_C="💡 **Demande d'évolution enregistrée** — merci !
          Précisez le cas d'usage (qui, quand, pourquoi) : cela aide à prioriser. Les demandes sont groupées dans la prochaine version 0.x."
          else
            BODY_C="👋 **Merci pour votre ticket.**
          Il nous manque des informations pour le classer : pouvez-vous préciser ce qui s'est passé, où (page/écran), et ce que vous attendiez à la place ?"
          fi
          printf '%s\n' "$BODY_C" > ack.md
          gh issue comment "$ISSUE" --body-file ack.md
          echo "Triaged issue #$ISSUE from @$AUTHOR with labels: ${LABELS[*]}"
