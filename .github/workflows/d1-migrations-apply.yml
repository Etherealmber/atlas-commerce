name: D1 production migrations (manual)

# Run it from GitHub → Actions → "D1 production migrations (manual)" → Run workflow.
#
#   action = list   → shows which files in migrations/ are applied / pending on the
#                     PRODUCTION database (company-stock-db). Read-only, no confirmation.
#   action = apply  → applies every pending migration to PRODUCTION, then lists again.
#                     Requires typing APPLY in the confirm box.
#   action = setup-target → finds (or creates once) the D1 database "atlas-db" used by
#                     the DB_TARGET binding (Paramètres › Base de données: copy + cutover)
#                     and brings its schema/migration ledger up to date. Requires APPLY.
#
# Nothing here runs automatically: no push/PR/schedule trigger. CI's
# "Fresh D1 migrations apply" job only tests migrations on a throwaway local DB.
# Secrets (either naming works — the repo already has CF_API_TOKEN + CF_ZONE_ID):
#   CLOUDFLARE_API_TOKEN or CF_API_TOKEN   (needs Account → D1 → Edit)
#   CLOUDFLARE_ACCOUNT_ID, or CF_ZONE_ID   (the account id is then read from the zone)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list = show applied/pending (read-only) · apply = apply pending migrations to PRODUCTION'
        required: true
        default: list
        type: choice
        options:
          - list
          - apply
          - setup-target
          - journal-setup
          - journal-check
          - mail-inventory
          - delete-test-mail
      confirm:
        description: 'Type APPLY for D1 changes, or CREATE-JOURNAL to provision a new private journal bucket'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: d1-production-migrations
  cancel-in-progress: false

jobs:
  migrations:
    if: inputs.action != 'journal-setup' && inputs.action != 'journal-check' && inputs.action != 'mail-inventory' && inputs.action != 'delete-test-mail'
    name: D1 migrations — ${{ inputs.action }} (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Check confirmation
        if: inputs.action == 'apply' && inputs.confirm != 'APPLY'
        run: |
          echo "::error::Type APPLY in the confirm box to apply migrations to production. Nothing was changed."
          exit 1

      - name: Check confirmation (setup-target)
        if: inputs.action == 'setup-target' && inputs.confirm != 'APPLY'
        run: |
          echo "::error::Type APPLY in the confirm box to create/update atlas-db. Nothing was changed."
          exit 1

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) secret is required (repo or 'production' environment)."
            exit 1
          fi

      - name: Resolve Cloudflare account id
        if: env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          set -euo pipefail
          id=""
          if [ -n "${CF_ZONE_ID:-}" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            # Account-scoped tokens may not read zones: fall back to the accounts the token can see.
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not resolve the Cloudflare account id: add CLOUDFLARE_ACCOUNT_ID, or give the token Zone → Read on CF_ZONE_ID."
            exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrations status before
        if: inputs.action != 'setup-target'
        run: |
          set -o pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc 2>&1 | tee before.txt
          {
            echo "## D1 production — status before (${{ inputs.action }})"
            echo '```'
            cat before.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations to production
        if: inputs.action == 'apply'
        run: |
          set -o pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc 2>&1 | tee apply.txt
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc 2>&1 | tee after.txt
          {
            echo "## Applied"
            echo '```'
            cat apply.txt
            echo '```'
            echo "## D1 production — status after"
            echo '```'
            cat after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # DB_TARGET (wrangler.jsonc) has no database_id on purpose: deploys bind "atlas-db"
      # by name. This finds it — or creates it the first time — and applies the same
      # migrations so its d1_migrations ledger is correct before the copy + cutover.
      - name: Find or create atlas-db and apply migrations
        if: inputs.action == 'setup-target'
        run: |
          set -o pipefail
          if npx wrangler d1 info atlas-db --json > info.json 2> info.err; then
            echo "atlas-db already exists."
          else
            cat info.err
            npx wrangler d1 create atlas-db 2>&1 | tee create.txt
            npx wrangler d1 info atlas-db --json > info.json
          fi
          uuid=$(jq -r '.uuid // empty' info.json)
          npx wrangler d1 migrations apply DB_TARGET --remote --config wrangler.jsonc 2>&1 | tee target.txt
          {
            echo "## atlas-db (DB_TARGET)"
            echo "Database id: \`${uuid:-unknown}\`"
            echo '```'
            cat target.txt
            echo '```'
            echo "Next: redeploy the Worker (it binds atlas-db by name), then open Paramètres › Base de données — the panel detects DB_TARGET."
          } >> "$GITHUB_STEP_SUMMARY"

  journal-setup:
    if: inputs.action == 'journal-setup'
    name: Provision private journal bucket (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm != 'CREATE-JOURNAL'
        run: echo '::error::Confirmation required; no resource was modified.' && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve account
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Cloudflare token missing'; exit 1; }
          id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$id" ] && [ -n "$CF_ZONE_ID" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r ' .result[0].id // empty' || true)
          fi
          test -n "$id" || { echo '::error::Cloudflare account ID not resolved'; exit 1; }
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
      - name: Create new private bucket and set 30-day retention
        run: |
          set -euo pipefail
          bucket=atlas-commerce-private-api-journal-1
          # Create only; never modify an existing bucket whose privacy is unknown.
          npx wrangler r2 bucket create "$bucket"
          npx wrangler r2 bucket lifecycle add "$bucket" journal-expire-30d api-journal/ --expire-days 30 --force
          npx wrangler r2 bucket lifecycle list "$bucket"
          npx wrangler r2 bucket dev-url get "$bucket"
          npx wrangler r2 bucket domain list "$bucket"
          echo 'Created bucket and requested 30-day expiry. Verify the output confirms the bucket has no public domain or dev URL before binding it. No Worker secret or deployment was changed.' >> "$GITHUB_STEP_SUMMARY"

  journal-check:
    if: inputs.action == 'journal-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Check bucket access and lifecycle without exposing data
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$id" ] && [ -n "$CF_ZONE_ID" ]; then
            id=$(curl -fsS -H "$auth" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "$auth" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | jq -r '.result[0].id // empty' || true)
          fi
          test -n "$id"
          echo "::add-mask::$id"
          base="https://api.cloudflare.com/client/v4/accounts/$id/r2/buckets/atlas-commerce-private-api-journal-1"
          managed=$(curl -fsS -H "$auth" "$base/domains/managed")
          custom=$(curl -fsS -H "$auth" "$base/domains/custom")
          lifecycle=$(curl -fsS -H "$auth" "$base/lifecycle")
          echo "$managed" | jq -e '.success == true and .result.enabled == false' > /dev/null || { echo '::error::Managed public URL is enabled or could not be verified'; exit 1; }
          echo "$custom" | jq -e '.success == true and (.result.domains | type == "array") and ([.result.domains[] | select(.enabled != false)] | length == 0)' > /dev/null || { echo '::error::A public custom domain is enabled or could not be verified'; exit 1; }
          echo "$lifecycle" | jq -e '.success == true and ([.result.rules[]? | select(.id == "journal-expire-30d" and .enabled == true and .conditions.prefix == "api-journal/" and .deleteObjectsTransition.condition.maxAge == 2592000)] | length == 1)' > /dev/null || { echo '::error::The expected 30-day lifecycle rule could not be verified'; exit 1; }
          echo '::notice::Journal bucket: public URLs disabled and 30-day journal lifecycle verified.'

  mail-inventory:
    if: inputs.action == 'mail-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Count legacy mail without reading message contents
        run: |
          set -euo pipefail
          id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$id" ] && [ -n "$CF_ZONE_ID" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | jq -r '.result[0].id // empty' || true)
          fi
          test -n "$id"
          echo "::add-mask::$id"
          export CLOUDFLARE_ACCOUNT_ID="$id"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS total, SUM(CASE WHEN created_at < datetime('now','-30 days') THEN 1 ELSE 0 END) AS older_30d, SUM(CASE WHEN created_at < datetime('now','-90 days') THEN 1 ELSE 0 END) AS older_90d, SUM(CASE WHEN r2_key != '' THEN 1 ELSE 0 END) AS r2_references FROM mail_messages" > mail-counts.json
          counts=$(jq -ce '.[0].results[0] | {total, older_30d, older_90d, r2_references}' mail-counts.json)
          echo "::notice title=Legacy mail counts::$counts"
          echo "Legacy mail aggregate counts: $counts" >> "$GITHUB_STEP_SUMMARY"

  delete-test-mail:
    if: inputs.action == 'delete-test-mail'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Require explicit test-mail confirmation
        if: inputs.confirm != 'DELETE-129-TEST-MAIL'
        run: echo '::error::Confirmation required; no data changed.' && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Delete only the previously inventoried test rows
        run: |
          set -euo pipefail
          id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$id" ] && [ -n "$CF_ZONE_ID" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | jq -r '.result[0].id // empty' || true)
          fi
          test -n "$id"
          echo "::add-mask::$id"
          export CLOUDFLARE_ACCOUNT_ID="$id"
          # Atomic guard: do not touch newer or changed inventories. R2 objects are
          # intentionally not deleted because references may be shared.
          if ! npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "DELETE FROM mail_messages WHERE created_at < datetime('now','-30 days') AND (SELECT COUNT(*) FROM mail_messages)=129 AND (SELECT COUNT(*) FROM mail_messages WHERE created_at < datetime('now','-30 days'))=129 AND (SELECT COUNT(*) FROM mail_messages WHERE r2_key != '')=128" > result.json 2> error.txt; then
            if grep -qiE 'quota|limit exceeded|exceeded.*limit' error.txt; then echo '::error::Cloudflare reports a quota or limit error.'; elif grep -qiE 'permission|authentication|unauthorized|not authorized' error.txt; then echo '::error::Cloudflare rejected the database write permission.'; else echo '::error::Cloudflare rejected the database delete; inspect the workflow log.'; fi
            exit 1
          fi
          changes=$(jq -er '.[0].meta.changes | numbers' result.json)
          if [ "$changes" != 129 ]; then echo "::error::Inventory changed or deletion incomplete: deleted $changes rows. Review before retry."; exit 1; fi
          echo '::notice::Deleted 129 inventoried test mail rows; no R2 objects were deleted.'
          echo 'Deleted 129 inventoried test mail rows; referenced R2 objects were not deleted.' >> "$GITHUB_STEP_SUMMARY"
