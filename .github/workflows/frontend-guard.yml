name: Frontend guard (client)

# Gates every client-side change: the Vite build must succeed, the bundle must
# contain hashed assets, and src/ TypeScript errors must not exceed baseline.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-guard.yml'

permissions:
  contents: read

concurrency:
  group: frontend-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    name: oxlint — correctness gate (zero errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Fails on ANY correctness error in src/ or worker/ (warnings, like the
      # known no-unused-vars backlog, are reported but do not block).
      - run: npm ci
      - name: Version sync guard (src/version.ts vs package.json)
        run: npm run check:version
      - run: npm run lint
      - name: Test issue triage without a checkout
        run: node --test scripts/issue-triage-workflow.test.mjs
      - name: Validate translation catalogs
        run: |
          npm run i18n:validate
          node --test scripts/i18n-validate.test.mjs scripts/i18n-ast-scan.test.mjs

  client-build:
    name: Vite build + bundle sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain (1.82.0 + wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.82.0
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry and Rust target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust/atlas-finance-core
      - run: npm ci
      - run: npm run build
      - name: bundle sanity (index.html + hashed assets present)
        run: |
          test -f dist/client/index.html
          grep -qE '/assets/index-[^"]+\.js' dist/client/index.html
          test -n "$(ls dist/client/assets/*.js 2>/dev/null | head -1)"
          echo "client bundle OK"

  client-typecheck:
    name: src/ TypeScript — no new errors vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (src scope)
        run: |
          npx tsc --noEmit > tsc.log || true
          COUNT=$(grep -vE '^worker/' tsc.log | grep -cE 'error TS' || true)
          BASE=$(grep -E '^src=' scripts/tsc-baseline.txt | cut -d= -f2)
          echo "src TypeScript errors: $COUNT (baseline: $BASE)"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::New TypeScript errors in src/ ($COUNT > $BASE baseline). Fix them before this can merge."
            grep -vE '^worker/' tsc.log | grep -E 'error TS' | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::src baseline improved ($COUNT < $BASE) — lower src= in scripts/tsc-baseline.txt to lock the gain."
          fi
