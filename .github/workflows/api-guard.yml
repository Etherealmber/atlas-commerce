name: API guard (worker)

# Gates every change that can touch the API: TypeScript errors beyond the
# recorded baseline fail, and the worker must bundle + validate its config
# through a dry-run (nothing is ever deployed by this workflow).

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-guard.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-guard.yml'

permissions:
  contents: read

concurrency:
  group: api-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-typecheck:
    name: Worker TypeScript — no new errors vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (worker scope)
        run: |
          npx tsc --noEmit > tsc.log || true
          COUNT=$(grep -cE '^worker/.*error TS' tsc.log || true)
          BASE=$(grep -E '^worker=' scripts/tsc-baseline.txt | cut -d= -f2)
          echo "worker TypeScript errors: $COUNT (baseline: $BASE)"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::New TypeScript errors in worker/ ($COUNT > $BASE baseline). Fix them before this can merge."
            grep -E '^worker/.*error TS' tsc.log | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::Worker baseline improved ($COUNT < $BASE) — lower worker= in scripts/tsc-baseline.txt to lock the gain."
          fi

      - name: unit tests (vitest — android release pipeline)
        run: npm test

  worker-bundle:
    name: Worker bundles + wrangler config validates (dry-run only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain (1.82.0 + wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.82.0
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry and Rust target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust/atlas-finance-core
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy --dry-run (validates built Cloudflare bundle, deploys nothing)
        run: |
          set -o pipefail
          # wrangler >= 4.15 requires Node >= 22 — a mismatch crashes instantly
          # with a generic exit 1, so print the toolchain before validating.
          node -v
          npx wrangler --version
          test -f dist/company_stock/wrangler.json
          npx wrangler deploy --dry-run --config dist/company_stock/wrangler.json --outdir /tmp/wrangler-bundle-check 2>&1 | tee wrangler-dry-run.log || {
            echo "::error::wrangler dry-run failed — last lines below"
            tail -40 wrangler-dry-run.log
            exit 1
          }
