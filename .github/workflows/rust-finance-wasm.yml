name: Rust Finance WASM Core & Production Pipeline

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'shared/financeCore.ts'
      - 'worker/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'scripts/build-finance-wasm.mjs'
      - '.github/workflows/rust-finance-wasm.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'shared/financeCore.ts'
      - 'worker/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'scripts/build-finance-wasm.mjs'
      - '.github/workflows/rust-finance-wasm.yml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type DEPLOY to run manual production release after verification'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: rust-finance-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Rust Build, WASM ABI v2, Parity, Build & Workerd Certification
    runs-on: ubuntu-latest
    env:
      ATLAS_REQUIRE_WASM: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain (1.82.0 + wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.82.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and Rust target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust/atlas-finance-core

      - run: npm ci

      - name: Rust unit + ABI tests, release wasm32 build & export verification
        run: npm run build:finance-wasm

      - name: Strict compiled-WASM <-> TypeScript parity & benchmark tests
        run: npm run test:finance-wasm

      - name: TypeScript check (Worker + Frontend — 0 errors required)
        run: npx tsc --noEmit

      - name: Lint correctness check (oxlint — 0 errors required)
        run: npm run lint -- --quiet

      - name: CSS & UI invariants check
        run: node scripts/css-check.mjs

      - name: Production Vite + Cloudflare Workers build & verify bundled .wasm
        run: |
          npm run build
          test -f dist/company_stock/wrangler.json

      - name: Full Worker, Frontend & Cloudflare workerd runtime integration suite
        run: npx vitest run

      - name: Wrangler dry-run verification (no deployment)
        run: npx wrangler deploy --config dist/company_stock/wrangler.json --dry-run --outdir /tmp/wrangler-bundle-check

      - name: Generate CycloneDX SBOM & SHA-256 checksums for verified artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json
          sha256sum worker/wasm/atlas_finance_core.wasm dist/company_stock/index.js dist/company_stock/wrangler.json dist/client/index.html dist/sbom.cdx.json dist/company_stock/assets/*atlas_finance_core*.wasm > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload verified build + WASM artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-commerce-verified-bundle
          path: |
            dist/
            worker/wasm/atlas_finance_core.wasm
          retention-days: 14

  deploy-production:
    name: Manual Production Deploy (Exact Verified Artifact)
    needs: build-and-verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download exact verified artifact (no Rust/JS rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-commerce-verified-bundle

      - name: Verify SHA-256 checksums before deploy
        run: sha256sum -c dist/SHA256SUMS.txt

      - name: Deploy verified bundle to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/company_stock/wrangler.json
