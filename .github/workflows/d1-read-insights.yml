name: D1 read and write insights (read-only)

# Which query shapes consume the most D1 reads and writes, without printing raw SQL.
# Read-only: it only calls Cloudflare's D1 analytics (`wrangler d1 insights`),
# never touches data or schema. Run it from GitHub → Actions → "D1 read insights".
# Secrets: CLOUDFLARE_API_TOKEN or CF_API_TOKEN (Account → D1 → Read is enough),
# CLOUDFLARE_ACCOUNT_ID or CF_ZONE_ID (the account id is then read from the zone).

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Time window (e.g. 1d, 7d, 30d)'
        required: true
        default: 7d
        type: string

permissions:
  contents: read

jobs:
  insights:
    name: D1 top queries by rows read and written
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      PERIOD: ${{ inputs.period || '7d' }}
    steps:
      - name: Resolve Cloudflare account id
        if: env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          set -euo pipefail
          id=""
          if [ -n "${CF_ZONE_ID:-}" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
          fi
          if [ -z "$id" ]; then echo "::error::Could not resolve the Cloudflare account id."; exit 1; fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Aggregated top query shapes
        run: |
          set -euo pipefail
          case "$PERIOD" in 1h|6h|1d|7d|30d) ;; *) echo "::error::Unsupported time window"; exit 1;; esac
          for sort in writes reads count; do
            if ! npx wrangler d1 insights company-stock-db --time-period "$PERIOD" --sort-type sum --sort-by "$sort" --limit 25 --json > "ins-$sort.json" 2> err.txt; then
              echo "::error title=D1 insights unavailable::Cloudflare D1 Analytics query failed. Check the token's Analytics and D1 read permissions and account scope."
              exit 1
            fi
            node scripts/d1-insights-summary.mjs "ins-$sort.json" > "summary-$sort.tsv"
            {
              echo "## company-stock-db — top query shapes by $sort ($PERIOD)"
              echo '```'
              cat "summary-$sort.tsv"
              echo '```'
              echo 'Values are aggregated query insights, not account billing totals. SQL and parameter values are not included.'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(head -26 "summary-$sort.tsv" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=D1 top by $sort::$msg"
          done
