name: D1 read insights (read-only)

# Which queries read the most rows on the production D1 databases.
# Read-only: it only calls Cloudflare's D1 analytics (`wrangler d1 insights`),
# never touches data or schema. Run it from GitHub → Actions → "D1 read insights".
# Secrets: CLOUDFLARE_API_TOKEN or CF_API_TOKEN (Account → D1 → Read is enough),
# CLOUDFLARE_ACCOUNT_ID or CF_ZONE_ID (the account id is then read from the zone).

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Time window (e.g. 1d, 7d, 30d)'
        required: true
        default: 7d
        type: string
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/d1-read-insights.yml']

permissions:
  contents: read

jobs:
  insights:
    name: D1 top queries by rows read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      PERIOD: ${{ inputs.period || '7d' }}
    steps:
      - name: Resolve Cloudflare account id
        if: env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          set -euo pipefail
          id=""
          if [ -n "${CF_ZONE_ID:-}" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" | jq -r '.result.account.id // empty' || true)
          fi
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
          fi
          if [ -z "$id" ]; then echo "::error::Could not resolve the Cloudflare account id."; exit 1; fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Top queries by rows read
        run: |
          set -uo pipefail
          for db in company-stock-db atlas-db; do
            for sort in reads count; do
              echo "::group::$db — top by $sort ($PERIOD)"
              if npx wrangler d1 insights "$db" --time-period "$PERIOD" --sort-type sum --sort-by "$sort" --limit 25 --json > "ins-$db-$sort.json" 2> err.txt; then
                # Query text is SQL with bound parameters; trimmed to 400 chars per line.
                jq -r '.[] | [ (.totalRowsRead // .rowsRead // 0), (.numberOfTimesRun // .count // 0), (.avgRowsRead // 0), (.query | gsub("\\s+"; " ") | .[0:400]) ] | @tsv' "ins-$db-$sort.json" \
                  | awk -F'\t' 'BEGIN{print "rows_read\truns\tavg_rows\tquery"} {print}' | tee "ins-$db-$sort.tsv"
                {
                  echo "## $db — top 25 by $sort ($PERIOD)"
                  echo '```'
                  cat "ins-$db-$sort.tsv"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                # Also surface as a check-run annotation (readable via the REST API
                # when raw logs are not reachable). Newlines are %0A-encoded.
                msg=$(head -26 "ins-$db-$sort.tsv" | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
                echo "::notice title=$db top by $sort ($PERIOD)::$msg"
              else
                echo "insights unavailable for $db:"; cat err.txt | head -20
                echo "::warning title=$db insights unavailable::$(head -5 err.txt | tr '\n' ' ')"
              fi
              echo "::endgroup::"
            done
          done
