<!DOCTYPE html>
<html lang="fr">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas Commerce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Favicons — v265 raster brand: light art by default, white art in dark mode -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/favicon-32x32-dark.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" href="/favicon-16x16-dark.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- v0.7 — splash lockups preloaded: no logo pop-in during loading state -->
    <link rel="preload" as="image" href="/atlas-logo-light.png" />
    <link rel="preload" as="image" href="/atlas-logo-dark.png" />
    <!-- iOS home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="description" content="Atlas Commerce — stock, caisse et facturation pour commerces et entrepôts au Maroc." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atlas Commerce" />
    <meta property="og:title" content="Atlas Commerce" />
    <meta property="og:description" content="Atlas Commerce — stock, caisse et facturation pour commerces et entrepôts au Maroc." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlas Commerce" />
    <meta name="twitter:description" content="Atlas Commerce — stock, caisse et facturation pour commerces et entrepôts au Maroc." />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Atlas Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html { --boot-bg: #f5f2eb; --boot-fg: #0f1b2d; --boot-muted: #6b7280; }
      html[data-theme="dark"] { --boot-bg: #111113; --boot-fg: #e4e4e7; --boot-muted: #a1a1aa; }
      html, body { margin: 0; background: var(--boot-bg); color: var(--boot-fg); font-family: system-ui, sans-serif; }
      #root:empty::after {
        content: 'Chargement…';
        display: block;
        text-align: center;
        padding: 48px;
        color: var(--boot-muted);
        font-size: 14px;
      }
      #root.boot-slow:empty::after {
        content: 'Chargement lent — vérifiez le réseau ou actualisez.';
      }
      /* v0.7 — Android-style splash: brand lockup + loader until the shell paints */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; background: var(--boot-bg);
        transition: opacity 0.3s ease;
      }
      #splash.sp-hide { opacity: 0; pointer-events: none; }
      #splash .sp-logo { display: block; width: 200px; height: auto; }
      #splash .sp-dark { display: none; }
      html[data-theme="dark"] #splash .sp-light { display: none; }
      html[data-theme="dark"] #splash .sp-dark { display: block; }
      #splash .sp-spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25);
        border-top-color: var(--boot-fg);
        animation: sp-spin 0.8s linear infinite;
      }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      #splash .sp-text {
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--boot-muted); font-weight: 600;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-spinner { animation-duration: 1.8s; }
        #splash { transition: none; }
      }
    </style>
    <script>
      /* Apply the saved theme before first paint — no white flash in dark mode */
      (function () {
        try {
          var m = localStorage.getItem('atlas-theme') || 'light';
          var dark = m === 'dark' ||
            (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.classList.toggle('theme-dark', dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#111113' : '#f4f5f7');
        } catch (e) { /* private mode — default light */ }
      })();
    </script>
  </head>
  <body>
    <!-- v0.7 — splash screen (logo + état de chargement, comme sur Android) -->
    <div id="splash" aria-hidden="true">
      <img src="/atlas-logo-light.png" alt="" class="sp-logo sp-light" width="200" height="65" />
      <img src="/atlas-logo-dark.png" alt="" class="sp-logo sp-dark" width="200" height="65" />
      <div class="sp-spinner"></div>
      <div class="sp-text">Chargement…</div>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          var sp = document.getElementById('splash');
          if (sp) sp.remove();
          r.classList.add('boot-slow');
          r.innerHTML = '<div style="text-align:center;padding:48px;font-family:system-ui;color:#334">' +
            '<p style="font-size:15px;margin:0 0 12px">L\'application met trop de temps à démarrer.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#0a0a0a;color:#fff;font-weight:600;cursor:pointer">Actualiser</button>' +
            '<p style="font-size:12px;color:#6b7280;margin-top:14px">Vérifiez le réseau. Videz le cache du navigateur (Ctrl+Shift+R).</p></div>';
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
