<!DOCTYPE html>
<html lang="fr">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B1F1A" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas Commerce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Atlas Commerce — Stock & facturation</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <!-- Preconnect only; fonts load async with display=swap (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    
    
    <style>
      /* Critical first-paint — avoid blank flash while JS boots */
      html, body { margin: 0; background: #f5f2eb; color: #0f1b2d; font-family: system-ui, sans-serif; }
      #root:empty::after {
        content: 'Chargement…';
        display: block;
        text-align: center;
        padding: 48px;
        color: #6b7280;
        font-size: 14px;
      }
      #root.boot-slow:empty::after {
        content: 'Chargement lent — vérifiez le réseau ou actualisez.';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If React never mounts (bundle error), show recovery after 8s
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.classList.add('boot-slow');
          r.innerHTML = '<div style="text-align:center;padding:48px;font-family:system-ui;color:#334">' +
            '<p style="font-size:15px;margin:0 0 12px">L\'application met trop de temps à démarrer.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#1a6b66;color:#fff;font-weight:600;cursor:pointer">Actualiser</button>' +
            '<p style="font-size:12px;color:#6b7280;margin-top:14px">Vérifiez le réseau. Videz le cache du navigateur (Ctrl+Shift+R). Les erreurs MIME = ancien déploiement — reconstruisez avec npm run build && wrangler deploy.</p></div>';
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
