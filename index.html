    <style>
      html { --boot-bg: #f5f2eb; --boot-fg: #0f1b2d; --boot-muted: #6b7280; }
      html[data-theme="dark"] { --boot-bg: #111113; --boot-fg: #e4e4e7; --boot-muted: #a1a1aa; }
      html, body { margin: 0; background: var(--boot-bg); color: var(--boot-fg); font-family: system-ui, sans-serif; }
      #root:empty::after {
        content: 'Chargement…';
        display: block;
        text-align: center;
        padding: 48px;
        color: var(--boot-muted);
        font-size: 14px;
      }
      #root.boot-slow:empty::after {
        content: 'Chargement lent — vérifiez le réseau ou actualisez.';
      }
      /* L — boot splash: sunburst lockup drawn with CSS keyframes (no images, no JS) */
      #splash {
        position: fixed; inset: 0; z-index: 9999; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: var(--boot-bg); color: #0f1115;
        transition: opacity 0.16s ease;
      }
      html[data-theme="dark"] #splash { color: #ffffff; }
      #splash.sp-hide { opacity: 0; pointer-events: none; }
      #splash .sp-lockup { display: block; width: min(212px, 58vw); height: auto; overflow: visible; }
      #splash .sp-ticks line {
        stroke-dasharray: 1 1; stroke-dashoffset: 1;
        animation: sp-draw 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards, sp-wave 1.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 30ms), calc(1250ms + var(--i) * 120ms);
      }
      #splash .sp-ticks .sp-beam { animation: sp-draw 0.56s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards; }
      #splash .sp-word { clip-path: inset(-4% 100% -4% 0); animation: sp-clip 0.62s cubic-bezier(0.22, 1, 0.36, 1) 0.64s forwards; }
      #splash .sp-word-ar { display: none; font: 700 145px Tahoma, Arial, sans-serif; }
      html[data-boot-lang=ar] #splash .sp-word { display: none; }
      html[data-boot-lang=ar] #splash .sp-word-ar { display: block; }
      html[data-boot-lang=ar] #splash .sp-text { letter-spacing: 0; }
      #splash .sp-word path {
        opacity: 0; transform-box: fill-box; transform: translateX(-35%);
        animation: sp-letter 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(660ms + var(--i) * 45ms);
      }
      #splash .sp-text {
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--boot-muted); font-weight: 600;
        opacity: 0; animation: sp-fade 0.4s ease 1.1s forwards;
      }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-wave { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
      @keyframes sp-clip { to { clip-path: inset(-4% -2% -4% 0); } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
        #splash .sp-ticks line { stroke-dashoffset: 0; }
        #splash .sp-word { clip-path: none; }
        #splash .sp-word path, #splash .sp-text { opacity: 1; transform: none; }
      }
    </style>
    <script>
      /* Apply the saved theme before first paint — no white flash in dark mode */
      (function () {
        try {
          var requestedLang = new URLSearchParams(location.search).get('lang');
          var bootLang = ['ar', 'en', 'fr'].includes(requestedLang) ? requestedLang : localStorage.getItem('atlas_lang');
          if (bootLang === 'ar' || bootLang === 'en') document.documentElement.setAttribute('data-boot-lang', bootLang);
          var m = localStorage.getItem('atlas-theme') || 'system';
          var dark = m === 'dark' ||
            (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.classList.toggle('theme-dark', dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#111113' : '#f4f5f7');
        } catch (e) { /* private mode — default light */ }
      })();
    </script>

    <div id="root"></div>
    <script>
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          var sp = document.getElementById('splash');
          if (sp) sp.remove();
          r.classList.add('boot-slow');
          r.innerHTML = '<div style="text-align:center;padding:48px;font-family:system-ui;color:#334">' +
            '<p style="font-size:15px;margin:0 0 12px">L\'application met trop de temps à démarrer.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#0a0a0a;color:#fff;font-weight:600;cursor:pointer">Actualiser</button>' +
            '<p style="font-size:12px;color:#6b7280;margin-top:14px">Vérifiez le réseau. Videz le cache du navigateur (Ctrl+Shift+R).</p></div>';
        }
      }, 20000);
    </script>
