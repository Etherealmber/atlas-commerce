<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" fill="none">
  <!-- Full-screen splash: logo centered with large margins (no crop zoom) -->
  <rect width="1080" height="1920" fill="#0B1F1A"/>
  <defs>
    <linearGradient id="sg" x1="340" y1="760" x2="740" y2="1160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft ambient -->
  <circle cx="540" cy="900" r="220" fill="#14b8a6" opacity="0.12"/>
  <!-- Icon card -->
  <rect x="390" y="760" width="300" height="300" rx="68" fill="#0f2a24" stroke="#1a4a40" stroke-width="2"/>
  <path
    d="M540 820 L650 1008 H612 L590 950 H490 L468 1008 H430 L540 820 Z"
    fill="url(#sg)"
    filter="url(#glow)"
  />
  <path d="M510 928 H570 L540 868 Z" fill="#f0fdf4"/>
  <circle cx="618" cy="848" r="14" fill="#fbbf24"/>
  <!-- Wordmark -->
  <text
    x="540" y="1140"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#e8eef6"
    letter-spacing="0.5"
  >Atlas Commerce</text>
  <text
    x="540" y="1188"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#94a3b8"
  >Stock · Caisse · Facturation</text>
</svg>
